name: PulseIQ Monthly Report

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-monthly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild database and analytics pipeline
        run: python run_pipeline.py

      - name: Determine previous month
        id: period
        run: |
          MONTH=$(python -c "from datetime import date, timedelta; print((date.today().replace(day=1) - timedelta(days=1)).strftime('%Y-%m'))")
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Generate monthly Excel report
        run: python build_report.py --month "${{ steps.period.outputs.month }}"

      - name: Upload monthly report
        uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report-${{ steps.period.outputs.month }}
          path: reports/monthly_report_${{ steps.period.outputs.month }}.xlsx
          if-no-files-found: error
          retention-days: 30
