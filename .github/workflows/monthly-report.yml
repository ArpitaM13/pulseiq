
name: PulseIQ Monthly Report

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-monthly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild database and analytics pipeline
        run: python run_pipeline.py

      - name: Determine latest available reporting month
        id: period
        shell: bash
        run: |
          MONTH=$(python - <<'PY'
          import duckdb

          connection = duckdb.connect(
              "data/pulseiq.duckdb",
              read_only=True
          )

          result = connection.execute("""
              SELECT strftime(MAX(period), '%Y-%m')
              FROM analytics.vw_company_kpis
          """).fetchone()[0]

          connection.close()

          if not result:
              raise SystemExit("No reporting month found in vw_company_kpis.")

          print(result)
          PY
          )

          echo "Latest available reporting month: $MONTH"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

      - name: Generate monthly Excel report
        run: python build_report.py --month "${{ steps.period.outputs.month }}"

      - name: Upload monthly report
        uses: actions/upload-artifact@v4
        with:
          name: pulseiq-monthly-report-${{ steps.period.outputs.month }}
          path: reports/monthly_report_${{ steps.period.outputs.month }}.xlsx
          if-no-files-found: error
          retention-days: 30
