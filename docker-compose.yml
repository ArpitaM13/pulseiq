services:
  pipeline:
    build: .
    command: python run_pipeline.py
    volumes:
      - .:/app
  dashboard:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - pipeline
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - pipeline
